[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # These three are PUBLIC by design (they end up in the browser bundle). Tell Netlify's
  # secret scanner not to fail the build on them. Never add the service-role key here.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_CONTACT_EMAIL"

# API routes first (explicit, so the SPA fallback can never swallow them)
[[redirects]]
  from = "/api/movies"
  to = "/.netlify/functions/movies"
  status = 200
[[redirects]]
  from = "/api/admin/movies"
  to = "/.netlify/functions/admin-movies"
  status = 200
[[redirects]]
  from = "/api/my-list"
  to = "/.netlify/functions/my-list"
  status = 200
[[redirects]]
  from = "/api/complaints"
  to = "/.netlify/functions/complaints"
  status = 200

# Single-page-app fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
